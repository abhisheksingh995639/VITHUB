    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        teal: { 500: '#14b8a6' },
                        cyan: { 500: '#06b6d4' },
                        amber: { 500: '#f59e0b' },

    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1554034483-04fda0d3507b?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.5s ease-in-out, background-image 0.5s ease-in-out;
        }

        .dark body {
            background-image: none;
            background-color: #111827;
        }
        .dark .glass-card, .dark .skeleton-card {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .dark .glass-card:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        .dark .modal-bg {
             background: rgba(0, 0, 0, 0.7);
        }
        .dark #suggestionModal > div {
            background-color: #1f2937;
        }
        .dark select option {
            background-color: #374151;
            color: #f3f4f6;
        }
        .dark .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        .glass-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px) !important;
        }

        .modal-bg {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        select option {
            color: #000;
        }

        .skeleton-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, increment, query, orderBy, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const localFirebaseConfig = {
            apiKey: "AIzaSyB8f4b8xdU5Uq-HHqQ8kwxG6i18zdi8JAo",
            authDomain: "site-hub-29fb2.firebaseapp.com",
            projectId: "site-hub-29fb2",
            storageBucket: "site-hub-29fb2.appspot.com",
            messagingSenderId: "373988520340",
            appId: "1:373988520340:web:f9eafe75c8de05cca55f81",
            measurementId: "G-DDEMB3X2XQ"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : localFirebaseConfig;

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        document.addEventListener('DOMContentLoaded', () => {
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    initializeAppLogic(user);
                } else {
                    signInAnonymously(auth).catch((error) => {
                        console.error("Anonymous sign-in failed:", error);
                        const grid = document.getElementById('resourceGrid');
                        grid.innerHTML = `<p class="text-center text-red-400 col-span-full is-visible">Authentication Failed. Please check your Firebase setup and security rules.</p>`;
                    });
                }
            });

            function initializeAppLogic(user) {
                if (!user) {
                    console.error("Initialization failed: No user found.");
                    return;
                }
                
                const userUid = user.uid;

                const resourcesRef = collection(db, `resources`);

                const categoryColors = {
                    entertainment: 'bg-purple-600',
                    academics: 'bg-indigo-500',
                    notes: 'bg-amber-500',
                    productivity: 'bg-gray-700',
                    coding: 'bg-teal-500',
                    design: 'bg-pink-500',
                    utilities: 'bg-cyan-500',
                    'student-projects': 'bg-yellow-500',
                };

                let resources = [];

                const grid = document.getElementById('resourceGrid');
                const searchInput = document.getElementById('searchInput');
                const filterSelect = document.getElementById('filterSelect');
                const subFilterContainer = document.getElementById('subFilterContainer');
                const subFilterButtons = document.querySelectorAll('.sub-filter-btn');
                let activeSubCategory = 'all';

                const toTopBtn = document.getElementById('toTopBtn');
                const themeToggleBtn = document.getElementById('theme-toggle');
                const darkIcon = document.getElementById('theme-toggle-dark-icon');
                const lightIcon = document.getElementById('theme-toggle-light-icon');
                
                const suggestionModal = document.getElementById('suggestionModal');
                const suggestResourceBtn = document.getElementById('suggestResourceBtn');
                const suggestionCancelBtn = document.getElementById('suggestionCancelBtn');
                const suggestionForm = document.getElementById('suggestionForm');
                const suggestionResult = document.getElementById('suggestionResult');
                
                // THEME LOGIC
                const applyTheme = (theme) => {
                    if (theme === 'dark') {
                        document.documentElement.classList.add('dark');
                        darkIcon.classList.add('hidden');
                        lightIcon.classList.remove('hidden');
                    } else {
                        document.documentElement.classList.remove('dark');
                        darkIcon.classList.remove('hidden');
                        lightIcon.classList.add('hidden');
                    }
                };

                const savedTheme = localStorage.getItem('theme');
                applyTheme(savedTheme || 'light');

                themeToggleBtn.addEventListener('click', () => {
                    const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                    applyTheme(newTheme);
                    localStorage.setItem('theme', newTheme);
                });

                // ANIMATION OBSERVER
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                        }
                    });
                }, { threshold: 0.1 });
                
                // VOTING (Secure)
                async function handleVoteClick(event, id) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    const resourceIndex = resources.findIndex(r => r.id === id);
                    if (resourceIndex === -1) return;
                    
                    const resource = resources[resourceIndex];
                    if (resource.votedBy && resource.votedBy.includes(userUid)) {
                        console.log("Already voted for this item (checked locally).");
                        return;
                    }
                    
                    const resourceRef = doc(db, `resources`, id);
                    
                    try {
                        // Atomically increment votes and add user's UID to the 'votedBy' array
                        await updateDoc(resourceRef, {
                            votes: increment(1),
                            votedBy: arrayUnion(userUid)
                        });

                        // Update local data to reflect the vote
                        resources[resourceIndex].votes++;
                        if (resources[resourceIndex].votedBy) {
                            resources[resourceIndex].votedBy.push(userUid);
                        } else {
                            resources[resourceIndex].votedBy = [userUid];
                        }
                        
                        // Update the UI
                        const voteCountElement = document.getElementById(`vote-count-${id}`);
                        const voteButtonElement = document.getElementById(`vote-btn-${id}`);
                        
                        if (voteCountElement) {
                            const currentVotes = parseInt(voteCountElement.innerText);
                            voteCountElement.innerText = currentVotes + 1;
                            
                            voteCountElement.classList.add('scale-150', 'transition-transform', 'duration-300');
                            setTimeout(() => voteCountElement.classList.remove('scale-150'), 300);
                        }
                        if (voteButtonElement) {
                            voteButtonElement.disabled = true;
                            voteButtonElement.classList.remove('text-white/50', 'hover:text-blue-400');
                            voteButtonElement.classList.add('text-blue-500');
                        }
                    } catch (error) {
                        console.error("Vote failed:", error.message);
                        if (error.code === 'permission-denied') {
                             console.log("Permission denied. You likely already voted.");
                             const voteButtonElement = document.getElementById(`vote-btn-${id}`);
                             if(voteButtonElement) voteButtonElement.disabled = true;
                        }
                    }
                }
                window.handleVoteClick = handleVoteClick;

                // RENDERING (XSS Patched + Tabnabbing Fix)
                const renderResources = (data) => {
                    grid.innerHTML = '';
                    if (data.length === 0) {
                        grid.innerHTML = `<p class="text-center text-gray-200 col-span-full is-visible">No resources found.</p>`;
                        return;
                    }
                    data.forEach(resource => {
                        const card = document.createElement('a');
                        card.href = resource.url;
                        card.target = "_blank";
                        card.rel = "noopener noreferrer"; // Tabnabbing fix
                        card.className = 'glass-card rounded-xl overflow-hidden p-4 block no-underline';
                        
                        // Check the 'votedBy' array from the database for the user's UID
                        const hasVoted = resource.votedBy && resource.votedBy.includes(userUid);
                        const voteButtonColor = hasVoted ? 'text-blue-500' : 'text-white/50';

                        // Handle both old and new data formats
                        let categories = [];
                        let subcategories = [];

                        if (resource.categories && Array.isArray(resource.categories)) {
                            categories = resource.categories;
                        } else if (resource.category) {
                            categories = [resource.category];
                        }

                        if (resource.subcategories && Array.isArray(resource.subcategories)) {
                            subcategories = resource.subcategories;
                        } else if (resource.subCategory) {
                            subcategories = [resource.subCategory];
                        }

                        // --- START XSS FIX ---
                        const topDiv = document.createElement('div');
                        topDiv.className = 'flex justify-between items-start mb-3';

                        const h2 = document.createElement('h2');
                        h2.className = 'text-xl font-bold text-white pr-2';
                        h2.textContent = resource.name;
                        topDiv.appendChild(h2);

                        const voteDiv = document.createElement('div');
                        voteDiv.className = 'flex items-center gap-2 text-white font-semibold flex-shrink-0';

                        const voteSpan = document.createElement('span');
                        voteSpan.id = `vote-count-${resource.id}`;
                        voteSpan.textContent = resource.votes || 0;
                        voteDiv.appendChild(voteSpan);

                        const voteButton = document.createElement('button');
                        voteButton.id = `vote-btn-${resource.id}`;
                        voteButton.className = `vote-btn ${voteButtonColor} hover:text-blue-400 transition`;
                        if (hasVoted) {
                            voteButton.disabled = true;
                        }
                        voteButton.onclick = (event) => handleVoteClick(event, resource.id);
                        
                        const voteIcon = document.createElement('i');
                        voteIcon.className = 'fas fa-arrow-up';
                        voteButton.appendChild(voteIcon);
                        voteDiv.appendChild(voteButton);
                        
                        topDiv.appendChild(voteDiv);

                        const badgesDiv = document.createElement('div');
                        badgesDiv.className = 'flex flex-wrap gap-2';

                        categories.forEach(cat => {
                            const badge = document.createElement('span');
                            badge.className = `text-xs font-semibold ${categoryColors[cat] || 'bg-gray-500'} text-white py-1 px-2 rounded-full capitalize`;
                            badge.textContent = cat.replace('-', ' ');
                            badgesDiv.appendChild(badge);
                        });

                        subcategories.forEach(subcat => {
                            const badge = document.createElement('span');
                            badge.className = 'text-xs font-semibold bg-gray-500 text-white py-1 px-2 rounded-full capitalize';
                            badge.textContent = subcat;
                            badgesDiv.appendChild(badge);
                        });

                        card.appendChild(topDiv);
                        card.appendChild(badgesDiv);
                        // --- END XSS FIX ---

                        grid.appendChild(card);
                        observer.observe(card);
                    });
                };

                const updateSubFilterButtons = () => {
                    subFilterButtons.forEach(btn => {
                        btn.classList.toggle('bg-white/30', btn.dataset.value === activeSubCategory);
                        btn.classList.toggle('bg-white/10', btn.dataset.value !== activeSubCategory);
                    });
                };

                const filterAndRender = () => {
                    const searchTerm = searchInput.value.toLowerCase();
                    const selectedCategory = filterSelect.value;
                    const selectedSubCategory = activeSubCategory;

                    let scoredResources = resources.map(resource => {
                        let score = 0;
                        const name = resource.name.toLowerCase();
                        
                        let categories = [];
                        let subcategories = [];
                        
                        if (resource.categories && Array.isArray(resource.categories)) {
                            categories = resource.categories.map(c => c.toLowerCase().replace('-', ' '));
                        } else if (resource.category) {
                            categories = [resource.category.toLowerCase().replace('-', ' ')];
                        }

                        if (resource.subcategories && Array.isArray(resource.subcategories)) {
                            subcategories = resource.subcategories.map(s => s.toLowerCase());
                        } else if (resource.subCategory) {
                            subcategories = [resource.subCategory.toLowerCase()];
                        }

                        if (searchTerm && name.includes(searchTerm)) score = 3;
                        else if (searchTerm && categories.some(cat => cat.includes(searchTerm))) score = 2;
                        else if (searchTerm && subcategories.some(sub => sub.includes(searchTerm))) score = 1;

                        return { resource, score };
                    });

                    let filteredResources = scoredResources.filter(item => {
                        const { resource } = item;
                        
                        let resourceCategories = [];
                        let resourceSubcategories = [];
                        
                        if (resource.categories && Array.isArray(resource.categories)) {
                            resourceCategories = resource.categories;
                        } else if (resource.category) {
                            resourceCategories = [resource.category];
                        }

                        if (resource.subcategories && Array.isArray(resource.subcategories)) {
                            resourceSubcategories = resource.subcategories;
                        } else if (resource.subCategory) {
                            resourceSubcategories = [resource.subCategory];
                        }
                        
                        const categoryMatch = selectedCategory === 'all' || resourceCategories.includes(selectedCategory);
                        const searchMatch = searchTerm ? item.score > 0 : true;
                        
                        let subCategoryMatch = true;
                        if (selectedCategory === 'entertainment' && selectedSubCategory !== 'all') {
                            subCategoryMatch = resourceSubcategories.includes(selectedSubCategory);
                        }
                        
                        return searchMatch && categoryMatch && subCategoryMatch;
                    })
                    .sort((a, b) => b.score - a.score || b.resource.votes - a.resource.votes)
                    .map(item => item.resource);

                    renderResources(filteredResources);
                };
                
                // DATA FETCHING
                async function fetchData() {
                    const q = query(resourcesRef, orderBy('votes', 'desc'));
                    try {
                        const snapshot = await getDocs(q);
                        resources = snapshot.docs.map(doc => ({ id: doc.id, votedBy: [], ...doc.data() }));
                        filterAndRender();
                    } catch (error) {
                        console.error("Error fetching data from Firestore: ", error);
                        grid.innerHTML = `<p class="text-center text-red-400 col-span-full is-visible">Error loading data. Check Firestore rules and configuration.</p>`;
                    }
                }
                fetchData();

                // EVENT LISTENERS
                searchInput.addEventListener('input', filterAndRender);
                filterSelect.addEventListener('change', () => {
                    subFilterContainer.classList.toggle('hidden', filterSelect.value !== 'entertainment');
                    activeSubCategory = 'all'; 
                    updateSubFilterButtons();
                    filterAndRender();
                });

                subFilterButtons.forEach(button => {
                    button.addEventListener('click', (e) => {
                        e.preventDefault();
                        activeSubCategory = button.dataset.value;
                        updateSubFilterButtons();
                        filterAndRender();
                    });
                });

                suggestResourceBtn.addEventListener('click', () => showModal(suggestionModal));
                suggestionCancelBtn.addEventListener('click', () => hideModal(suggestionModal));
                suggestionModal.addEventListener('click', (e) => {
                    if (e.target === suggestionModal) hideModal(suggestionModal);
                });

                suggestionForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const form = e.target;
                    const formData = new FormData(form);
                    const object = Object.fromEntries(formData.entries());
                    const json = JSON.stringify(object);
            
                    const resultEl = document.getElementById('suggestionResult');
                    resultEl.innerHTML = "Submitting...";
                    resultEl.classList.remove('text-green-500', 'text-red-500');
            
                    try {
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: json
                        });
            
                        const result = await response.json();
            
                        if (result.success) {
                            resultEl.innerHTML = "Suggestion submitted successfully! Thank you.";
                            resultEl.classList.add('text-green-500');
                            form.reset();
                            setTimeout(() => {
                                hideModal(suggestionModal);
                                resultEl.innerHTML = "";
                            }, 3000);
                        } else {
                            console.error("Submission failed:", result);
                            resultEl.innerHTML = result.message || "An error occurred.";
                            resultEl.classList.add('text-red-500');
                        }
                    } catch (error) {
                        console.error("Error submitting form:", error);
                        resultEl.innerHTML = "An error occurred while submitting.";
                        resultEl.classList.add('text-red-500');
                    }
                });
                
                window.addEventListener('scroll', () => toTopBtn.classList.toggle('hidden', window.scrollY <= 300));
                toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                
                function showModal(modal) { modal.classList.replace('hidden', 'flex'); }
                function hideModal(modal) { modal.classList.replace('flex', 'hidden'); }
            }
        });
    </script>
</body>
</html>
