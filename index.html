    <style>
        /* Custom Styles */
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1554034483-04fda0d3507b?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.5s ease-in-out, background-image 0.5s ease-in-out;
        }

        /* --- Dark Mode Styles --- */
        .dark body {
            background-image: none;
            background-color: #111827; /* Tailwind's gray-900 */
        }
        .dark .glass-card, .dark .skeleton-card {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .dark .glass-card:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        .dark .modal-bg {
             background: rgba(0, 0, 0, 0.7);
        }
        .dark #suggestionModal > div {
            background-color: #1f2937; /* gray-800 */
        }
        .dark select option {
            background-color: #374151; /* gray-700 */
            color: #f3f4f6; /* gray-100 */
        }
        .dark .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .glass-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px) !important;
        }

        /* Modal styles */
        .modal-bg {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        /* Fix for dropdown option visibility */
        select option {
            color: #000;
        }

        /* --- Skeleton Loader Styles --- */
        .skeleton-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

    <script type="module">

        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, writeBatch, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- PASTE YOUR FIREBASE CONFIGURATION HERE ---
        const localFirebaseConfig = {
            apiKey: "AIzaSyB8f4b8xdU5Uq-HHqQ8kwxG6i18zdi8JAo",
            authDomain: "site-hub-29fb2.firebaseapp.com",
            projectId: "site-hub-29fb2",
            storageBucket: "site-hub-29fb2.appspot.com",
            messagingSenderId: "373988520340",
            appId: "1:373988520340:web:f9eafe75c8de05cca55f81",
            measurementId: "G-DDEMB3X2XQ"
        };

        // --- FIREBASE CONFIG (DO NOT EDIT BELOW) ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : localFirebaseConfig;

        // --- INITIALIZE FIREBASE ---
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- AUTHENTICATION ---
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // User is signed in.
                    initializeAppLogic(user);
                } else {
                    // User is signed out. Sign in anonymously.
                    signInAnonymously(auth).catch((error) => {
                        console.error("Anonymous sign-in failed:", error);
                        const grid = document.getElementById('resourceGrid');
                        grid.innerHTML = `<p class="text-center text-red-400 col-span-full is-visible">Authentication Failed. Please check your Firebase setup and security rules.</p>`;
                    });
                }
            });

            function initializeAppLogic(user) {
                if (!user) {
                    console.error("Initialization failed: No user found.");
                    return;
                }

                // --- Firestore Collection Reference ---
                const resourcesRef = collection(db, `resources`);
                
                // --- LOCAL DATA (For initial seeding) ---
                const initialResources = [
                    { name: '1Flex', url: 'https://www.1flex.ru', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'FlickyStream', url: 'https://flickystream.ru', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'RgShows', url: 'https://www.rgshows.ru/?m=m-1383072', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'Cineby', url: 'https://www.cineby.ru/', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'Cinema Deck', url: 'https://cinemadeck.com/home', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'FullHDMovies', url: 'https://fullhdmovies.me', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'NEPU', url: 'https://nepu.to', category: 'entertainment', subCategory: 'movies', votes: 0 },
                    { name: 'Miruro', url: 'https://www.miruro.to/', category: 'entertainment', subCategory: 'anime', votes: 0 },
                    { name: 'Enma', url: 'https://www.enma.lol', category: 'entertainment', subCategory: 'anime', votes: 0 },
                    { name: 'Gojo', url: 'https://animetsu.bz', category: 'entertainment', subCategory: 'anime', votes: 0 },
                    { name: 'Kaido', url: 'https://kaido.to/home', category: 'entertainment', subCategory: 'anime', votes: 0 },
                    { name: 'Uber', url: 'https://www.uber.com/in/en/', category: 'utilities', votes: 0 },
                    { name: 'Amazon', url: 'https://www.amazon.in/', category: 'utilities', votes: 0 },
                    { name: 'Zomato', url: 'https://www.zomato.com/', category: 'utilities', votes: 0 },
                    { name: 'YouTube', url: 'https://www.youtube.com/', category: 'entertainment', subCategory: 'streaming', votes: 0 },
                    { name: 'Khan Academy', url: 'https://www.khanacademy.org/', category: 'academics', votes: 0 },
                    { name: 'Flipkart', url: 'https://www.flipkart.com/', category: 'utilities', votes: 0 },
                    { name: 'Notion', url: 'https://www.notion.so/', category: 'productivity', votes: 0 },
                    { name: 'OLX', url: 'https://www.olx.in/', category: 'utilities', votes: 0 },
                    { name: 'Grammarly', url: 'https://www.grammarly.com/', category: 'academics', votes: 0 },
                    { name: 'Google Scholar', url: 'https://scholar.google.com/', category: 'academics', votes: 0 },
                    { name: 'Canva', url: 'https://www.canva.com/', category: 'design', votes: 0 },
                    { name: 'Ola Cabs', url: 'https://www.olacabs.com/', category: 'utilities', votes: 0 },
                    { name: 'Cabmate', url: 'https://cabmatevit.netlify.app', category: 'utilities', votes: 0 },
                    { name: 'Netflix', url: 'https://netflix.com', category: 'entertainment', subCategory: 'streaming', votes: 0 },
                    { name: 'AI Note Taker', url: '#', category: 'student-projects', subCategory: 'Productivity', votes: 0 },
                    { name: 'Dorm Finder', url: '#', category: 'student-projects', subCategory: 'Utility', votes: 0 },
                ];

                const categoryColors = {
                    entertainment: 'bg-purple-600',
                    academics: 'bg-indigo-500',
                    notes: 'bg-amber-500',
                    productivity: 'bg-gray-700',
                    coding: 'bg-teal-500',
                    design: 'bg-pink-500',
                    utilities: 'bg-cyan-500',
                    'student-projects': 'bg-yellow-500',
                };

                let resources = [];
                let votedItems = JSON.parse(localStorage.getItem('votedItems')) || [];

                // --- ELEMENTS ---
                const grid = document.getElementById('resourceGrid');
                const searchInput = document.getElementById('searchInput');
                const filterSelect = document.getElementById('filterSelect');
                const subFilterContainer = document.getElementById('subFilterContainer');
                const subFilterButtons = document.querySelectorAll('.sub-filter-btn');
                let activeSubCategory = 'all';

                const toTopBtn = document.getElementById('toTopBtn');
                const themeToggleBtn = document.getElementById('theme-toggle');
                const darkIcon = document.getElementById('theme-toggle-dark-icon');
                const lightIcon = document.getElementById('theme-toggle-light-icon');
                
                const suggestionModal = document.getElementById('suggestionModal');
                const suggestResourceBtn = document.getElementById('suggestResourceBtn');
                const suggestionCancelBtn = document.getElementById('suggestionCancelBtn');
                const suggestionForm = document.getElementById('suggestionForm');
                const suggestionResult = document.getElementById('suggestionResult');
                const addDataBtn = document.getElementById('addDataBtn');
                
                // --- THEME TOGGLE LOGIC ---
                const applyTheme = (theme) => {
                    if (theme === 'dark') {
                        document.documentElement.classList.add('dark');
                        darkIcon.classList.add('hidden');
                        lightIcon.classList.remove('hidden');
                    } else {
                        document.documentElement.classList.remove('dark');
                        darkIcon.classList.remove('hidden');
                        lightIcon.classList.add('hidden');
                    }
                };

                const savedTheme = localStorage.getItem('theme');
                applyTheme(savedTheme || 'light');

                themeToggleBtn.addEventListener('click', () => {
                    const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                    applyTheme(newTheme);
                    localStorage.setItem('theme', newTheme);
                });

                // --- ANIMATION OBSERVER ---
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                        }
                    });
                }, { threshold: 0.1 });
                
                // --- VOTING ---
                function handleVoteClick(event, id) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    if (votedItems.includes(id)) {
                        console.log("Already voted for this item.");
                        return;
                    }
                    
                    // Firestore update (background)
                    const resourceRef = doc(db, `resources`, id);
                    updateDoc(resourceRef, { votes: increment(1) });

                    // Local state update
                    votedItems.push(id);
                    localStorage.setItem('votedItems', JSON.stringify(votedItems));
                    
                    const resourceIndex = resources.findIndex(r => r.id === id);
                    if (resourceIndex > -1) {
                        resources[resourceIndex].votes++;
                    }

                    // Instant UI update
                    const voteCountElement = document.getElementById(`vote-count-${id}`);
                    const voteButtonElement = document.getElementById(`vote-btn-${id}`);
                    
                    if (voteCountElement) {
                        const currentVotes = parseInt(voteCountElement.innerText);
                        voteCountElement.innerText = currentVotes + 1;
                        
                        voteCountElement.classList.add('scale-150', 'transition-transform', 'duration-300');
                        setTimeout(() => voteCountElement.classList.remove('scale-150'), 300);
                    }
                    if (voteButtonElement) {
                        voteButtonElement.disabled = true;
                        voteButtonElement.classList.remove('text-white/50', 'hover:text-blue-400');
                        voteButtonElement.classList.add('text-blue-500');
                    }
                }
                window.handleVoteClick = handleVoteClick;

                // --- RENDERING ---
                const renderResources = (data) => {
                    grid.innerHTML = '';
                    if (data.length === 0) {
                        grid.innerHTML = `<p class="text-center text-gray-200 col-span-full is-visible">No resources found.</p>`;
                        return;
                    }
                    data.forEach(resource => {
                        const card = document.createElement('a');
                        card.href = resource.url;
                        card.target = "_blank";
                        card.className = 'glass-card rounded-xl overflow-hidden p-4 block no-underline';
                        
                        const hasVoted = votedItems.includes(resource.id);
                        const voteButtonColor = hasVoted ? 'text-blue-500' : 'text-white/50';

                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <h2 class="text-xl font-bold text-white pr-2">
                                    ${resource.name}
                                    ${resource.category === 'student-projects' ? '<i class="fas fa-graduation-cap text-yellow-400 text-sm ml-1"></i>' : ''}
                                </h2>
                                <div class="flex items-center gap-2 text-white font-semibold flex-shrink-0">
                                    <span id="vote-count-${resource.id}">${resource.votes || 0}</span>
                                    <button id="vote-btn-${resource.id}" onclick="handleVoteClick(event, '${resource.id}')" class="vote-btn ${voteButtonColor} hover:text-blue-400 transition" ${hasVoted ? 'disabled' : ''}>
                                        <i class="fas fa-arrow-up"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <span class="text-xs font-semibold ${categoryColors[resource.category] || 'bg-gray-500'} text-white py-1 px-2 rounded-full capitalize">${resource.category.replace('-', ' ')}</span>
                                ${resource.subCategory ? `<span class="text-xs font-semibold bg-gray-500 text-white py-1 px-2 rounded-full capitalize">${resource.subCategory}</span>` : ''}
                            </div>
                        `;
                        grid.appendChild(card);
                        observer.observe(card);
                    });
                };

                const updateSubFilterButtons = () => {
                    subFilterButtons.forEach(btn => {
                        btn.classList.toggle('bg-white/30', btn.dataset.value === activeSubCategory);
                        btn.classList.toggle('bg-white/10', btn.dataset.value !== activeSubCategory);
                    });
                };

                const filterAndRender = () => {
                    const searchTerm = searchInput.value.toLowerCase();
                    const selectedCategory = filterSelect.value;
                    const selectedSubCategory = activeSubCategory;

                    let scoredResources = resources.map(resource => {
                        let score = 0;
                        const name = resource.name.toLowerCase();
                        const category = resource.category.toLowerCase().replace('-', ' ');
                        const subCategory = resource.subCategory ? resource.subCategory.toLowerCase() : '';

                        if (searchTerm && name.includes(searchTerm)) score = 3;
                        else if (searchTerm && category.includes(searchTerm)) score = 2;
                        else if (searchTerm && subCategory.includes(searchTerm)) score = 1;

                        return { resource, score };
                    });

                    let filteredResources = scoredResources.filter(item => {
                        const { resource } = item;
                        const categoryMatch = selectedCategory === 'all' || resource.category === selectedCategory;
                        const searchMatch = searchTerm ? item.score > 0 : true;
                        let subCategoryMatch = true;
                        if (selectedCategory === 'entertainment' && selectedSubCategory !== 'all') {
                            subCategoryMatch = resource.subCategory === selectedSubCategory;
                        }
                        return searchMatch && categoryMatch && subCategoryMatch;
                    })
                    .sort((a, b) => b.score - a.score || b.resource.votes - a.resource.votes)
                    .map(item => item.resource);

                    renderResources(filteredResources);
                };
                
                // --- DATA FETCHING ---
                async function fetchData() {
                    const q = query(resourcesRef, orderBy('votes', 'desc'));
                    try {
                        const snapshot = await getDocs(q);
                        resources = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        filterAndRender();
                    } catch (error) {
                        console.error("Error fetching data from Firestore: ", error);
                        grid.innerHTML = `<p class="text-center text-red-400 col-span-full is-visible">Error loading data. Check Firestore rules and configuration.</p>`;
                    }
                }
                fetchData();


                // --- MODAL & UI EVENT LISTENERS ---
                searchInput.addEventListener('input', filterAndRender);
                filterSelect.addEventListener('change', () => {
                    subFilterContainer.classList.toggle('hidden', filterSelect.value !== 'entertainment');
                    activeSubCategory = 'all'; 
                    updateSubFilterButtons();
                    filterAndRender();
                });

                subFilterButtons.forEach(button => {
                    button.addEventListener('click', (e) => {
                        e.preventDefault();
                        activeSubCategory = button.dataset.value;
                        updateSubFilterButtons();
                        filterAndRender();
                    });
                });

                suggestResourceBtn.addEventListener('click', () => showModal(suggestionModal));
                suggestionCancelBtn.addEventListener('click', () => hideModal(suggestionModal));
                suggestionModal.addEventListener('click', (e) => {
                    if (e.target === suggestionModal) hideModal(suggestionModal);
                });

                suggestionForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const form = e.target;
                    const formData = new FormData(form);
                    const object = Object.fromEntries(formData.entries());
                    const json = JSON.stringify(object);
            
                    const resultEl = document.getElementById('suggestionResult');
                    resultEl.innerHTML = "Submitting...";
                    resultEl.classList.remove('text-green-500', 'text-red-500');
            
                    try {
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: json
                        });
            
                        const result = await response.json();
            
                        if (result.success) {
                            resultEl.innerHTML = "Suggestion submitted successfully! Thank you.";
                            resultEl.classList.add('text-green-500');
                            form.reset();
                            setTimeout(() => {
                                hideModal(suggestionModal);
                                resultEl.innerHTML = "";
                            }, 3000);
                        } else {
                            console.error("Submission failed:", result);
                            resultEl.innerHTML = result.message || "An error occurred.";
                            resultEl.classList.add('text-red-500');
                        }
                    } catch (error) {
                        console.error("Error submitting form:", error);
                        resultEl.innerHTML = "An error occurred while submitting.";
                        resultEl.classList.add('text-red-500');
                    }
                });
                
                window.addEventListener('scroll', () => toTopBtn.classList.toggle('hidden', window.scrollY <= 300));
                toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                
                // --- ONE-TIME DATA SEEDING (Dev only) ---
                addDataBtn.addEventListener('click', async () => {
                    console.log("Adding initial data to Firestore...");
                    const batch = writeBatch(db);
                    initialResources.forEach((resource) => {
                        const docRef = doc(collection(db, `resources`));
                        batch.set(docRef, resource);
                    });
                    await batch.commit();
                    alert("Initial data has been added to Firestore!");
                    addDataBtn.style.display = 'none';
                    fetchData(); // Fetch data again after adding it
                });
                function showModal(modal) { modal.classList.replace('hidden', 'flex'); }
                function hideModal(modal) { modal.classList.replace('flex', 'hidden'); }
            }
        });
    </script>
</body>
</html>
