    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1554034483-04fda0d3507b?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.5s ease-in-out, background-image 0.5s ease-in-out;

        .dark body {
            background-image: none;
            background-color: #111827;
        }
        .dark .glass-card, .dark .skeleton-card {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .dark .glass-card:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        .dark .modal-bg {
             background: rgba(0, 0, 0, 0.7);
        }
        .dark #suggestionModal > div {
            background-color: #1f2937;
        }
        .dark select option {
            background-color: #374151;
            color: #f3f4f6;
        }
        .dark .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .dark .sub-filter-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .dark .sub-filter-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .dark .sub-filter-btn.active {
            background-color: rgba(255, 255, 255, 0.2);
        }


        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        .glass-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px) !important;
        }

        .modal-bg {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        select option {
            color: #000;
        }

        .skeleton-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .sub-filter-btn.active {
            background-color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, increment, query, orderBy, getDocs, arrayUnion, arrayRemove, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // IMPORTANT: Replace this with your actual Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyB8f4b8xdU5Uq-HHqQ8kwxG6i18zdi8JAo",
            authDomain: "site-hub-29fb2.firebaseapp.com",
            projectId: "site-hub-29fb2",
            storageBucket: "site-hub-29fb2.appspot.com",
            messagingSenderId: "373988520340",
            appId: "1:373988520340:web:f9eafe75c8de05cca55f81",
            measurementId: "G-DDEMB3X2XQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    initializeAppLogic(user);
                } else {
                    signInAnonymously(auth).catch((error) => {
                        console.error("Anonymous sign-in failed:", error);
                        document.getElementById('resourceGrid').innerHTML = 
                            `<p class="text-center text-red-400 col-span-full is-visible">Authentication Failed. Please check your Firebase setup and security rules.</p>`;
                    });
                }
            });

            function initializeAppLogic(user) {
                if (!user) return console.error("Initialization failed: No user found.");
                
                const userUid = user.uid;
                let resources = [];
                let activeSubCategory = 'all';

                const grid = document.getElementById('resourceGrid');
                const searchInput = document.getElementById('searchInput');
                const filterSelect = document.getElementById('filterSelect');
                const subFilterContainer = document.getElementById('subFilterContainer');
                const subFilterButtonsWrapper = document.getElementById('subFilterButtons');
                const toTopBtn = document.getElementById('toTopBtn');
                const themeToggleBtn = document.getElementById('theme-toggle');
                const darkIcon = document.getElementById('theme-toggle-dark-icon');
                const lightIcon = document.getElementById('theme-toggle-light-icon');
                const suggestionModal = document.getElementById('suggestionModal');
                const suggestResourceBtn = document.getElementById('suggestResourceBtn');
                const suggestionCancelBtn = document.getElementById('suggestionCancelBtn');
                const suggestionForm = document.getElementById('suggestionForm');
                
                const applyTheme = (theme) => {
                    document.documentElement.classList.toggle('dark', theme === 'dark');
                    darkIcon.classList.toggle('hidden', theme === 'dark');
                    lightIcon.classList.toggle('hidden', theme !== 'dark');
                };

                applyTheme(localStorage.getItem('theme') || 'light');

                themeToggleBtn.addEventListener('click', () => {
                    const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                    applyTheme(newTheme);
                    localStorage.setItem('theme', newTheme);
                });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => entry.isIntersecting && entry.target.classList.add('is-visible'));
                }, { threshold: 0.1 });
                
                // --- (RACE CONDITION FIXED) handleVoteClick ---
                async function handleVoteClick(event, id) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    const voteButtonElement = document.getElementById(`vote-btn-${id}`);

                    if (!voteButtonElement || voteButtonElement.disabled) {
                        return;
                    }

                    voteButtonElement.disabled = true;

                    const resourceIndex = resources.findIndex(r => r.id === id);
                    if (resourceIndex === -1) {
                        voteButtonElement.disabled = false;
                        return;
                    }
                    
                    const resource = resources[resourceIndex];
                    const docRef = doc(db, 'resources', id);
                    const voteCountElement = document.getElementById(`vote-count-${id}`);
                    const hasVoted = resource.votedBy?.includes(userUid);

                    try {
                        if (hasVoted) {
                            // --- User is UN-VOTING ---
                            await updateDoc(docRef, {
                                votes: increment(-1),
                                votedBy: arrayRemove(userUid)
                            });

                            resources[resourceIndex].votes--;
                            resources[resourceIndex].votedBy = resources[resourceIndex].votedBy.filter(uid => uid !== userUid);
                            
                            if (voteCountElement) voteCountElement.innerText = resources[resourceIndex].votes;
                            if (voteButtonElement) {
                                voteButtonElement.classList.remove('text-blue-500');
                                voteButtonElement.classList.add('text-white/50', 'hover:text-blue-400');
                            }
                        } else {
                            // --- User is UP-VOTING ---
                            await updateDoc(docRef, {
                                votes: increment(1),
                                votedBy: arrayUnion(userUid)
                            });

                            resources[resourceIndex].votes++;
                            resources[resourceIndex].votedBy = [...(resources[resourceIndex].votedBy || []), userUid];
                            
                            if (voteCountElement) {
                                voteCountElement.innerText = resources[resourceIndex].votes;
                                voteCountElement.classList.add('scale-150', 'transition-transform', 'duration-300');
                                setTimeout(() => voteCountElement.classList.remove('scale-150'), 300);
                            }
                            if (voteButtonElement) {
                                voteButtonElement.classList.remove('text-white/50', 'hover:text-blue-400');
                                voteButtonElement.classList.add('text-blue-500');
                            }
                        }
                    } catch (error) {
                        console.error("Vote toggle failed:", error.message);
                    } finally {
                        voteButtonElement.disabled = false;
                    }
                }
                window.handleVoteClick = handleVoteClick;

                const normalizeData = (resource) => {
                    const categories = resource.categories || (resource.category ? [resource.category] : []);
                    const subcategories = resource.subcategories || (resource.subCategory ? [resource.subCategory] : []);
                    return { ...resource, categories, subcategories };
                };

                const categoryColors = {
                    entertainment: 'bg-purple-600',
                    academics: 'bg-indigo-500',
                    notes: 'bg-amber-500',
                    productivity: 'bg-gray-700',
                    coding: 'bg-teal-500',
                    design: 'bg-pink-500',
                    utilities: 'bg-cyan-500',
                    'student-projects': 'bg-yellow-500',
                };

                const renderResources = (data) => {
                    grid.innerHTML = data.length === 0 ? 
                        `<p class="text-center text-gray-200 col-span-full is-visible">No resources found.</p>` : '';
                    
                    data.forEach(resource => {
                        const { categories, subcategories } = resource;
                        const hasVoted = resource.votedBy?.includes(userUid);

                        const card = document.createElement('a');
                        card.href = resource.url;
                        card.target = "_blank";
                        card.rel = "noopener noreferrer";
                        card.className = 'glass-card rounded-xl overflow-hidden p-4 block no-underline';
                        
                        const topDiv = document.createElement('div');
                        topDiv.className = 'flex justify-between items-start mb-3';

                        const h2 = document.createElement('h2');
                        h2.className = 'text-xl font-bold text-white pr-2';
                        h2.textContent = resource.name;
                        topDiv.appendChild(h2);

                        const voteDiv = document.createElement('div');
                        voteDiv.className = 'flex items-center gap-2 text-white font-semibold flex-shrink-0';

                        const voteSpan = document.createElement('span');
                        voteSpan.id = `vote-count-${resource.id}`;
                        voteSpan.textContent = resource.votes || 0;
                        voteDiv.appendChild(voteSpan);

                        const voteButton = document.createElement('button');
                        voteButton.id = `vote-btn-${resource.id}`;
                        voteButton.className = `vote-btn ${hasVoted ? 'text-blue-500' : 'text-white/50 hover:text-blue-400'} transition`;
                        voteButton.onclick = (event) => handleVoteClick(event, resource.id);
                        
                        const voteIcon = document.createElement('i');
                        voteIcon.className = 'fas fa-arrow-up';
                        voteButton.appendChild(voteIcon);
                        voteDiv.appendChild(voteButton);
                        
                        topDiv.appendChild(voteDiv);

                        const badgesDiv = document.createElement('div');
                        badgesDiv.className = 'flex flex-wrap gap-2';

                        categories.forEach(cat => {
                            const badge = document.createElement('span');
                            badge.className = `text-xs font-semibold ${categoryColors[cat] || 'bg-gray-500'} text-white py-1 px-2 rounded-full capitalize`;
                            badge.textContent = cat.replace('-', ' ');
                            badgesDiv.appendChild(badge);
                        });

                        subcategories.forEach(subcat => {
                            const badge = document.createElement('span');
                            badge.className = 'text-xs font-semibold bg-gray-500 text-white py-1 px-2 rounded-full capitalize';
                            badge.textContent = subcat;
                            badgesDiv.appendChild(badge);
                        });

                        card.appendChild(topDiv);
                        card.appendChild(badgesDiv);
                        grid.appendChild(card);
                        observer.observe(card);
                    });
                };

                const updateSubFilterButtons = () => {
                    document.querySelectorAll('.sub-filter-btn').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.value === activeSubCategory);
                    });
                };

                function generateSubFilterButtons() {
                    subFilterButtonsWrapper.innerHTML = '';
                    
                    const entertainmentResources = resources.filter(r => 
                        (r.categories || []).includes('entertainment')
                    );
                    
                    const allSubCategories = entertainmentResources.flatMap(r => r.subcategories || []);
                    const uniqueSubCategories = [...new Set(allSubCategories)];
                    
                    const allButton = createSubFilterButton('all');
                    subFilterButtonsWrapper.appendChild(allButton);
                    
                    uniqueSubCategories.sort().forEach(sub => {
                        const button = createSubFilterButton(sub);
                        subFilterButtonsWrapper.appendChild(button);
                    });
                    
                    updateSubFilterButtons();
                }

                function createSubFilterButton(value) {
                    const button = document.createElement('button');
                    button.className = 'sub-filter-btn text-white bg-white/10 border border-white/20 rounded-full py-2 px-5 transition hover:bg-white/30 dark:border-gray-600 dark:hover:bg-gray-700';
                    button.dataset.value = value;
                    button.textContent = value.charAt(0).toUpperCase() + value.slice(1);
                    
                    button.addEventListener('click', (e) => {
                        e.preventDefault();
                        activeSubCategory = button.dataset.value;
                        updateSubFilterButtons();
                        filterAndRender();
                    });
                    return button;
                }

                const filterAndRender = () => {
                    const searchTerm = searchInput.value.toLowerCase();
                    const selectedCategory = filterSelect.value;

                    let scoredResources = resources.map(resource => {
                        const name = resource.name.toLowerCase();
                        const lowerCategories = resource.categories.map(c => c.toLowerCase().replace('-', ' '));
                        const lowerSubcategories = resource.subcategories.map(s => s.toLowerCase());
                        
                        let score = 0;
                        if (searchTerm) {
                            if (name.includes(searchTerm)) score = 3;
                            else if (lowerCategories.some(cat => cat.includes(searchTerm))) score = 2;
                            else if (lowerSubcategories.some(sub => sub.includes(searchTerm))) score = 1;
                        }

                        return { resource, score };
                    });

                    let filteredResources = scoredResources.filter(item => {
                        const { categories, subcategories } = item.resource;
                        
                        const categoryMatch = selectedCategory === 'all' || categories.includes(selectedCategory);
                        const searchMatch = !searchTerm || item.score > 0;
                        const subCategoryMatch = selectedCategory !== 'entertainment' || activeSubCategory === 'all' || 
                                                 subcategories.includes(activeSubCategory);
                        
                        return searchMatch && categoryMatch && subCategoryMatch;
                    })
                    .sort((a, b) => b.score - a.score || b.resource.votes - a.resource.votes)
                    .map(item => item.resource);

                    renderResources(filteredResources);
                };
                
                async function fetchData() {
                    const q = query(collection(db, 'resources'), orderBy('votes', 'desc'));
                    try {
                        const snapshot = await getDocs(q);
                        resources = snapshot.docs.map(doc => normalizeData({ id: doc.id, votedBy: [], ...doc.data() }));
                        filterAndRender();
                    } catch (error) {
                        console.error("Error fetching data from Firestore: ", error);
                        grid.innerHTML = `<p class="text-center text-red-400 col-span-full is-visible">Error loading data. Check Firestore rules and configuration.</p>`;
                    }
                }
                fetchData();

                searchInput.addEventListener('input', filterAndRender);

                filterSelect.addEventListener('change', () => {
                    const selectedCategory = filterSelect.value;
                    const isEntertainment = selectedCategory === 'entertainment';
                    
                    subFilterContainer.classList.toggle('hidden', !isEntertainment);
                    
                    if (isEntertainment) {
                        generateSubFilterButtons();
                    }
                    
                    activeSubCategory = 'all'; 
                    filterAndRender();
                });

                suggestResourceBtn.addEventListener('click', () => showModal(suggestionModal));
                suggestionCancelBtn.addEventListener('click', () => hideModal(suggestionModal));
                suggestionModal.addEventListener('click', (e) => {
                    if (e.target === suggestionModal) hideModal(suggestionModal);
                });

                // --- (Simultaneous Firestore & Web3Forms) suggestionForm ---
                suggestionForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const resultEl = document.getElementById('suggestionResult');
                    resultEl.innerHTML = "Submitting...";
                    resultEl.classList.remove('text-green-500', 'text-red-500');

                    try {
                        // --- 1. Get Data ---
                        const formData = new FormData(e.target);
                        const json = JSON.stringify(Object.fromEntries(formData.entries()));
                        
                        const name = formData.get('Site Name');
                        const url = formData.get('Site URL');
                        const reason = formData.get('Reason');
                        
                        // --- 2. Create Promises ---
                        
                        // Promise 1: Firestore
                        const firestorePromise = addDoc(collection(db, 'suggestions'), {
                            name: name,
                            url: url,
                            reason: reason,
                            submittedAt: serverTimestamp(),
                            status: 'pending'
                        });

                        // Promise 2: Web3Forms
                        const web3FormsPromise = fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: json
                        });

                        // --- 3. Run in Parallel ---
                        const [firestoreResult, web3FormsResponse] = await Promise.all([
                            firestorePromise,
                            web3FormsPromise
                        ]);

                        // --- 4. Check Web3Forms Result (optional) ---
                        const web3Result = await web3FormsResponse.json();
                        if (!web3Result.success) {
                            console.warn("Web3Forms email failed, but suggestion was saved to queue.", web3Result);
                        }

                        // --- 5. Success (as long as Firestore worked) ---
                        resultEl.innerHTML = "Suggestion submitted successfully! Thank you.";
                        resultEl.classList.add('text-green-500');
                        e.target.reset();
                        setTimeout(() => {
                            hideModal(suggestionModal);
                            resultEl.innerHTML = "";
                        }, 1000);

                    } catch (error) {
                        // This will catch if EITHER promise fails
                        console.error("Error submitting suggestion:", error);
                        resultEl.innerHTML = "An error occurred while submitting.";
                        resultEl.classList.add('text-red-500');
                    }
                });
                
                window.addEventListener('scroll', () => toTopBtn.classList.toggle('hidden', window.scrollY <= 300));
                toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                
                const showModal = (modal) => modal.classList.replace('hidden', 'flex');
                const hideModal = (modal) => modal.classList.replace('flex', 'hidden');
            }
        });
    </script>
</body>
</html>
