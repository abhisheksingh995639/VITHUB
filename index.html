<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Hub for Useful Sites</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // Configure Tailwind to use the 'class' strategy for dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        /* Custom Styles */
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1554034483-04fda0d3507b?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.5s ease-in-out, background-image 0.5s ease-in-out;
        }

        /* --- Dark Mode Styles --- */
        .dark body {
            background-image: none;
            background-color: #111827; /* Tailwind's gray-900 */
        }
        .dark .glass-card, .dark .skeleton-card {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .dark .glass-card:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        .dark .modal-bg {
             background: rgba(0, 0, 0, 0.7);
        }
        .dark #suggestionModal > div {
            background-color: #1f2937; /* gray-800 */
        }
        .dark select option {
            background-color: #374151; /* gray-700 */
            color: #f3f4f6; /* gray-100 */
        }
        .dark .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .glass-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px) !important;
        }

        /* Modal styles */
        .modal-bg {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        /* Fix for dropdown option visibility */
        select option {
            color: #000;
        }

        /* --- Skeleton Loader Styles --- */
        .skeleton-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .skeleton-placeholder {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200">

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="fixed top-6 right-6 z-50 w-12 h-12 bg-white/20 hover:bg-white/30 text-white rounded-full shadow-lg flex justify-center items-center text-xl transition-colors duration-300 backdrop-blur-sm">
        <i id="theme-toggle-dark-icon" class="fa fa-moon"></i>
        <i id="theme-toggle-light-icon" class="fa fa-sun hidden"></i>
    </button>

    <!-- Header Section -->
    <header class="container mx-auto px-6 pt-24 pb-16 text-center">
        <h1 class="text-5xl lg:text-6xl font-bold tracking-tight leading-tight text-white" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">The Ultimate Site Hub</h1>
        <p class="mt-4 text-lg text-gray-200 dark:text-gray-300 max-w-2xl mx-auto" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Your one-stop directory for learning, productivity, and everyday needs.</p>
    </header>

    <!-- Controls Section -->
    <div class="container mx-auto px-6 mb-16">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center p-4 rounded-xl glass-card is-visible">
            <!-- Left Side: Search & Filter -->
            <div class="flex flex-col sm:flex-row gap-4 w-full md:flex-grow">
                <div class="relative flex-grow">
                    <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-300"></i>
                    <input type="text" id="searchInput" placeholder="Search for a resource..." class="w-full text-white bg-white/10 border border-white/20 rounded-lg py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-white/50 transition placeholder-gray-300 dark:bg-gray-700/50 dark:border-gray-600 dark:placeholder-gray-400">
                </div>
                <select id="filterSelect" class="w-full sm:w-auto text-white bg-white/10 border border-white/20 rounded-lg py-3 pl-4 pr-10 appearance-none focus:outline-none focus:ring-2 focus:ring-white/50 transition dark:bg-gray-700/50 dark:border-gray-600">
                    <option value="all">All Categories</option>
                    <option value="learning">Learning</option>
                    <option value="productivity">Productivity</option>
                    <option value="transport">Transport</option>
                    <option value="shopping">Shopping</option>
                    <option value="food">Food</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="research">Research</option>
                    <option value="writing">Writing</option>
                    <option value="design">Design</option>
                </select>
            </div>
            <!-- Right Side: Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <button id="suggestResourceBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-300 shadow-lg flex items-center justify-center gap-2 w-full">
                    <i class="fa fa-lightbulb"></i> Suggest
                </button>
            </div>
        </div>
    </div>


    <!-- Main Content: Website Grid -->
    <main class="container mx-auto px-6 pb-12">
        <div id="resourceGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Skeleton cards are pre-rendered here -->
            <script>
                // Generate 8 skeleton cards on page load
                for (let i = 0; i < 8; i++) {
                    document.write(`
                        <div class="skeleton-card rounded-xl p-6 animate-pulse">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3 w-full">
                                    <div class="skeleton-placeholder h-6 w-6 rounded"></div>
                                    <div class="skeleton-placeholder h-6 w-1/2 rounded"></div>
                                </div>
                                <div class="skeleton-placeholder h-6 w-1/4 rounded-full"></div>
                            </div>
                            <div class="pl-9 space-y-2 mb-6">
                                <div class="skeleton-placeholder h-4 w-full rounded"></div>
                                <div class="skeleton-placeholder h-4 w-3/4 rounded"></div>
                            </div>
                            <div class="skeleton-placeholder h-10 w-full rounded-lg"></div>
                        </div>
                    `);
                }
            </script>
        </div>
    </main>

    <!-- Suggestion Modal -->
    <div id="suggestionModal" class="fixed inset-0 z-50 items-center justify-center hidden">
        <div class="modal-bg absolute inset-0"></div>
        <div class="relative w-full max-w-md p-8 m-4 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Suggest a Site</h2>
            <form id="suggestionForm">
                 <input type="hidden" name="apikey" value="76a4594d-6f73-47f1-b59e-7472327cdb0c">
                <div class="mb-4">
                    <label for="suggestSiteName" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Site Name</label>
                    <input type="text" id="suggestSiteName" name="Site Name" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                </div>
                <div class="mb-4">
                    <label for="suggestSiteUrl" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Site URL</label>
                    <input type="url" id="suggestSiteUrl" name="Site URL" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                </div>
                 <div class="mb-6">
                    <label for="suggestReason" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Reason for Suggestion</label>
                    <textarea id="suggestReason" name="Reason" rows="3" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required></textarea>
                </div>
                <div id="suggestionResult" class="mb-4 text-center"></div>
                <div class="flex justify-end gap-4">
                    <button type="button" id="suggestionCancelBtn" class="py-2 px-4 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg transition dark:bg-gray-600 dark:hover:bg-gray-500 dark:text-white">Cancel</button>
                    <button type="submit" class="py-2 px-6 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition font-semibold">Submit Suggestion</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Back to Top Button -->
    <button id="toTopBtn" class="fixed bottom-8 right-8 z-50 w-12 h-12 bg-pink-500/80 hover:bg-pink-600 text-white rounded-full shadow-lg hidden justify-center items-center text-xl transition-opacity duration-300">
        <i class="fa fa-arrow-up"></i>
    </button>

    <!-- Footer Section -->
    <footer class="text-center py-6 mt-12">
        <p class="text-gray-200 dark:text-gray-400" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">&copy; 2024 The Ultimate Site Hub. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA ---
            const categoryColors = {
                transport: 'bg-green-500',
                shopping: 'bg-blue-600',
                food: 'bg-red-500',
                entertainment: 'bg-purple-600',
                learning: 'bg-indigo-500',
                productivity: 'bg-gray-700',
                writing: 'bg-emerald-500',
                research: 'bg-amber-500',
                design: 'bg-pink-500',
            };

            let resources = [
                { id: 1, name: 'Uber', url: 'https://www.uber.com/in/en/', desc: 'Book a ride in minutes.', category: 'transport', color: categoryColors.transport, icon: 'fa-solid fa-car' },
                { id: 2, name: 'Amazon', url: 'https://www.amazon.in/', desc: 'India\'s largest online marketplace.', category: 'shopping', color: categoryColors.shopping, icon: 'fa-solid fa-shopping-cart' },
                { id: 3, name: 'Zomato', url: 'https://www.zomato.com/', desc: 'Find and order food from restaurants.', category: 'food', color: categoryColors.food, icon: 'fa-solid fa-utensils' },
                { id: 4, name: 'YouTube', url: 'https://www.youtube.com/', desc: 'Watch, share, and discover videos.', category: 'entertainment', color: categoryColors.entertainment, icon: 'fa-brands fa-youtube' },
                { id: 5, name: 'Khan Academy', url: 'https://www.khanacademy.org/', desc: 'Free online courses, lessons & practice.', category: 'learning', color: categoryColors.learning, icon: 'fa-solid fa-graduation-cap' },
                { id: 6, name: 'Flipkart', url: 'https://www.flipkart.com/', desc: 'India\'s leading e-commerce platform.', category: 'shopping', color: categoryColors.shopping, icon: 'fa-solid fa-store' },
                { id: 7, name: 'Notion', url: 'https://www.notion.so/', desc: 'The all-in-one workspace for your notes.', category: 'productivity', color: categoryColors.productivity, icon: 'fa-solid fa-check-double' },
                { id: 8, name: 'OLX', url: 'https://www.olx.in/', desc: 'Buy and sell used goods near you.', category: 'shopping', color: categoryColors.shopping, icon: 'fa-solid fa-handshake' },
                { id: 9, name: 'Grammarly', url: 'https://www.grammarly.com/', desc: 'AI-powered writing assistant.', category: 'writing', color: categoryColors.writing, icon: 'fa-solid fa-spell-check' },
                { id: 10, name: 'Google Scholar', url: 'https://scholar.google.com/', desc: 'Broadly search for scholarly literature.', category: 'research', color: categoryColors.research, icon: 'fa-solid fa-book-open' },
                { id: 11, name: 'Canva', url: 'https://www.canva.com/', desc: 'Easy-to-use graphic design platform.', category: 'design', color: categoryColors.design, icon: 'fa-solid fa-palette' },
                { id: 12, name: 'Ola Cabs', url: 'https://www.olacabs.com/', desc: 'The most popular cab booking service.', category: 'transport', color: categoryColors.transport, icon: 'fa-solid fa-taxi' },
                { id: 13, name: 'Cabmate', url: 'https://cabmatevit.netlify.app', desc: 'A reliable cab booking service.', category: 'transport', color: categoryColors.transport, icon: 'fa-solid fa-taxi' },
            ];

            // --- ELEMENTS ---
            const grid = document.getElementById('resourceGrid');
            const searchInput = document.getElementById('searchInput');
            const filterSelect = document.getElementById('filterSelect');
            const toTopBtn = document.getElementById('toTopBtn');
            const themeToggleBtn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');
            
            // Suggestion Modal Elements
            const suggestionModal = document.getElementById('suggestionModal');
            const suggestResourceBtn = document.getElementById('suggestResourceBtn');
            const suggestionCancelBtn = document.getElementById('suggestionCancelBtn');
            const suggestionForm = document.getElementById('suggestionForm');
            const suggestionResult = document.getElementById('suggestionResult');

            
            // --- THEME TOGGLE LOGIC ---
            const applyTheme = (theme) => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    darkIcon.classList.add('hidden');
                    lightIcon.classList.remove('hidden');
                } else {
                    document.documentElement.classList.remove('dark');
                    darkIcon.classList.remove('hidden');
                    lightIcon.classList.add('hidden');
                }
            };

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                applyTheme(savedTheme);
            } else {
                applyTheme('light');
            }

            themeToggleBtn.addEventListener('click', () => {
                const isDarkMode = document.documentElement.classList.contains('dark');
                const newTheme = isDarkMode ? 'light' : 'dark';
                applyTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            });

            // --- ANIMATION OBSERVER ---
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, { threshold: 0.1 });

            /**
             * Renders the resource cards to the grid.
             */
            const renderResources = (data) => {
                grid.innerHTML = ''; // Clear existing cards
                if (data.length === 0) {
                    grid.innerHTML = `<p class="text-center text-gray-200 col-span-full is-visible">No resources found.</p>`;
                    return;
                }
                data.forEach(resource => {
                    const card = document.createElement('div');
                    card.className = 'glass-card rounded-xl overflow-hidden flex flex-col p-6';
                    card.innerHTML = `
                        <div class="flex-grow">
                             <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3">
                                    <i class="${resource.icon} text-xl w-6 text-center text-white"></i>
                                    <h2 class="text-2xl font-bold text-white">${resource.name}</h2>
                                </div>
                                <span class="text-xs font-semibold ${resource.color} text-white py-1 px-3 rounded-full capitalize">${resource.category}</span>
                            </div>
                            <p class="text-gray-200 dark:text-gray-300 mb-6 pl-9">${resource.desc}</p>
                        </div>
                        <a href="${resource.url}" target="_blank" class="block w-full text-center font-semibold text-white py-2 px-4 rounded-lg bg-white/20 hover:bg-white/30 transition-colors duration-300">
                            Visit Site <i class="fa fa-arrow-right ml-2"></i>
                        </a>
                    `;
                    grid.appendChild(card);
                    observer.observe(card);
                });
            };

            /**
             * Filters and re-renders the resources.
             */
            const filterAndRender = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedCategory = filterSelect.value;
                
                let filteredResources = resources.filter(resource => {
                    const nameMatch = resource.name.toLowerCase().includes(searchTerm);
                    const categoryMatch = selectedCategory === 'all' || resource.category === selectedCategory;
                    return nameMatch && categoryMatch;
                });
                
                renderResources(filteredResources);
            };

            // --- MODAL HANDLING ---
            const showModal = (modal) => modal.classList.replace('hidden', 'flex');
            const hideModal = (modal) => modal.classList.replace('flex', 'hidden');

            // --- EVENT LISTENERS ---
            searchInput.addEventListener('input', filterAndRender);
            filterSelect.addEventListener('change', filterAndRender);

            // 'Suggest Resource' Modal listeners
            suggestResourceBtn.addEventListener('click', () => showModal(suggestionModal));
            suggestionCancelBtn.addEventListener('click', () => hideModal(suggestionModal));
            suggestionModal.addEventListener('click', (e) => {
                if (e.target === suggestionModal) hideModal(suggestionModal);
            });

            // Suggestion form submission
            suggestionForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                suggestionResult.innerHTML = `<span class="text-gray-400">Submitting...</span>`;
                const formData = new FormData(suggestionForm);
                
                try {
                    const response = await fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        suggestionResult.innerHTML = `<span class="text-green-500">Suggestion sent successfully!</span>`;
                        suggestionForm.reset();
                        setTimeout(() => {
                           suggestionResult.innerHTML = '';
                           hideModal(suggestionModal);
                        }, 3000);
                    } else {
                        console.error('Submission error:', result);
                        suggestionResult.innerHTML = `<span class="text-red-500">${result.message}</span>`;
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    suggestionResult.innerHTML = `<span class="text-red-500">An error occurred. Please try again.</span>`;
                }
            });
            
            // --- "BACK TO TOP" BUTTON LOGIC ---
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    toTopBtn.classList.replace('hidden', 'flex');
                } else {
                    toTopBtn.classList.replace('flex', 'hidden');
                }
            });
            toTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // --- INITIALIZATION ---
            // Simulate a network request delay before the first render
            setTimeout(() => {
                filterAndRender();
            }, 1500);
        });
    </script>
</body>
</html>
